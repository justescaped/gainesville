<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Room Game — Time Maze (GitHub Trigger)</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      display: grid;
      place-items: center;
      gap: 12px;
      margin: 0;
      padding: 16px;
      background: #f6f7f9;
    }
    #room {
      width: min(560px, 94vw);
      height: min(560px, 94vw);
      background: #86d7ff;
      position: relative;
      border: 4px solid rgba(0,0,0,0.25);
      box-sizing: border-box;
      border-radius: 10px;
      overflow: hidden;
      touch-action: none;
    }
    #world {
      width: 560px;
      height: 560px;
      position: absolute;
      left: 0; top: 0;
      transform-origin: top left;
      will-change: transform;
    }
    .wall {
      position: absolute;
      background: rgba(17, 24, 39, 0.58);
      border-radius: 6px;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08);
      pointer-events: none;
      z-index: 2;
    }
    .portal {
      position: absolute;
      width: 26px; height: 26px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 3;
      box-shadow: 0 8px 18px rgba(0,0,0,0.18), inset 0 0 0 2px rgba(255,255,255,0.28);
      opacity: 0.95;
    }
    .portal.future {
      background: radial-gradient(circle at 35% 35%, rgba(244,63,94,0.98), rgba(244,63,94,0.25) 55%, rgba(0,0,0,0));
    }
    .portal.past {
      background: radial-gradient(circle at 35% 35%, rgba(34,211,238,0.98), rgba(34,211,238,0.25) 55%, rgba(0,0,0,0));
    }
    .alien {
      position: absolute;
      width: 18px; height: 18px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9;
      background: radial-gradient(circle at 35% 35%, rgba(16,185,129,1), rgba(16,185,129,0.25) 60%, rgba(0,0,0,0));
      box-shadow: 0 6px 14px rgba(0,0,0,0.18), inset 0 0 0 2px rgba(255,255,255,0.24);
      opacity: 0.95;
    }
    #door {
      width: 110px; height: 210px;
      position: absolute; left: 16px; top: 175px;
      border-radius: 6px;
      z-index: 6;
      background: linear-gradient(90deg, #ffffff, #e9edf2 45%, #ffffff);
      box-shadow:
        inset 0 0 0 2px rgba(0,0,0,0.20),
        inset 0 0 0 8px rgba(255,255,255,0.45),
        0 10px 20px rgba(0,0,0,0.16);
      transform-origin: left center;
      transition: transform 180ms ease, filter 180ms ease, opacity 180ms ease;
    }
    #door::before {
      content: "";
      position: absolute;
      inset: -10px -8px -10px -12px;
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.18));
      z-index: -1;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.10);
    }
    #door.open {
      transform: perspective(700px) rotateY(35deg);
      filter: brightness(0.99);
      opacity: 0.92;
    }
    #doorSign {
      position: absolute;
      left: 14px; top: 36px;
      width: 84px; height: auto;
      border-radius: 4px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.22);
      user-select: none;
      pointer-events: none;
      z-index: 7;
    }
    #knob {
      position: absolute;
      left: 10px; top: 138px;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #f2f2f2, #9aa1aa 60%, #6c737d);
      box-shadow: inset 0 0 0 2px rgba(0,0,0,0.25), 0 2px 6px rgba(0,0,0,0.25);
      pointer-events: none;
      z-index: 8;
    }
    .hinge {
      position: absolute; right: 6px;
      width: 10px; height: 22px;
      border-radius: 3px;
      background: linear-gradient(180deg, #3a3f47, #1f2329);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10);
      pointer-events: none;
      opacity: 0.85;
      z-index: 8;
    }
    #hinge1 { top: 30px; }
    #hinge2 { top: 92px; }
    #hinge3 { top: 154px; }

    #player {
      width: 18px; height: 18px;
      background: #ff7a00;
      position: absolute;
      border-radius: 50%;
      box-shadow: 0 2px 0 rgba(0,0,0,0.18);
      outline: 2px solid rgba(255,255,255,0.65);
      z-index: 10;
    }

    #boom {
      position: absolute; inset: 0;
      background: rgba(244,63,94,0.0);
      pointer-events: none;
      z-index: 20;
      transition: background 120ms ease;
    }
    #boom.on { background: rgba(244,63,94,0.45); }

    .panel {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      min-height: 44px;
      text-align: center;
    }
    button {
      border: 0;
      padding: 10px 14px;
      border-radius: 12px;
      background: #111827;
      color: white;
      font-weight: 900;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .hint {
      color: rgba(0,0,0,0.65);
      font-size: 14px;
      max-width: 560px;
      line-height: 1.3;
    }
    .hud {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.65);
      box-shadow: 0 6px 14px rgba(0,0,0,0.08);
      font-weight: 900;
    }
    .hud .mini { font-size: 12px; font-weight: 800; opacity: 0.8; }
    #status { min-height: 22px; font-weight: 900; }

    .dpad {
      display: grid;
      grid-template-columns: 56px 56px 56px;
      grid-template-rows: 56px 56px 56px;
      gap: 10px;
      margin-top: 6px;
      align-items: center;
      justify-items: center;
    }
    .dpad button {
      width: 56px; height: 56px;
      padding: 0;
      border-radius: 14px;
      font-size: 18px;
      line-height: 1;
    }
    .dpad .blank {
      width: 56px; height: 56px;
      opacity: 0;
      pointer-events: none;
    }
    @media (max-width: 420px) {
      .dpad { grid-template-columns: 64px 64px 64px; grid-template-rows: 64px 64px 64px; }
      .dpad button, .dpad .blank { width: 64px; height: 64px; }
    }
    .pill {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,0.08);
      color: rgba(0,0,0,0.7);
      font-size: 12px;
      font-weight: 900;
    }
  </style>
</head>

      Find the perfect route + portal sequence to reach the door while avoiding all aliens.

  <div class="dpad" aria-label="Movement controls">
    <div class="blank"></div>
    <button id="btnUp" aria-label="Move up" type="button">▲</button>
    <div class="blank"></div>
    <button id="btnLeft" aria-label="Move left" type="button">◀</button>
    <div class="blank"></div>
    <button id="btnRight" aria-label="Move right" type="button">▶</button>
    <div class="blank"></div>
    <button id="btnDown" aria-label="Move down" type="button">▼</button>
    <div class="blank"></div>
  </div>

  <div id="status"></div>

  <script>
    // Trigger (recommended for GitHub hosting): Node-RED HTTP endpoint
    // Example: https://your-nodered-domain.com/roomgame/door
    const TRIGGER_URL = ""; // <-- set this
    const TRIGGER_PAYLOAD = { event: "doorsopen_plug_off" };

    const BASE = 560;
    const W = 18;

    const room = document.getElementById("room");
    const world = document.getElementById("world");
    const door = document.getElementById("door");
    const boom = document.getElementById("boom");

    const playerEl = document.getElementById("player");
    const openBtn = document.getElementById("openBtn");
    const statusEl = document.getElementById("status");
    const pillEl = document.getElementById("mqttPill");

    const timerText = document.getElementById("timerText");
    const timelineText = document.getElementById("timelineText");

    const portalF1El = document.getElementById("portalF1");
    const portalF2El = document.getElementById("portalF2");
    const portalPEl  = document.getElementById("portalP");

    const alienEls = [
      document.getElementById("alien1"),
      document.getElementById("alien2"),
      document.getElementById("alien3")
    ];

    const btnUp = document.getElementById("btnUp");
    const btnDown = document.getElementById("btnDown");
    const btnLeft = document.getElementById("btnLeft");
    const btnRight = document.getElementById("btnRight");

    function setPill(t) { pillEl.textContent = t; }
    function setStatus(t) { statusEl.textContent = t; }

    // Maze (perimeter solid; interior fully connected; start lane widened)
    const walls = [
      {x: 0, y: 0, w: BASE, h: W},
      {x: 0, y: BASE-W, w: BASE, h: W},
      {x: 0, y: 0, w: W, h: BASE},
      {x: BASE-W, y: 0, w: W, h: BASE},

      {x: 120, y: 40,  w: W, h: 190},
      {x: 120, y: 270, w: W, h: 250},

      {x: 240, y: 80,  w: W, h: 170},
      {x: 240, y: 290, w: W, h: 210},

      {x: 360, y: 40,  w: W, h: 210},
      {x: 360, y: 300, w: W, h: 220},

      // moved left (more dodging space at spawn)
      {x: 420, y: 110, w: W, h: 140},
      {x: 420, y: 300, w: W, h: 190},

      {x: 60,  y: 120, w: 140, h: W},
      {x: 170, y: 200, w: 150, h: W},
      {x: 60,  y: 280, w: 230, h: W},
      {x: 300, y: 340, w: 160, h: W},
      {x: 70,  y: 410, w: 220, h: W},
      {x: 300, y: 470, w: 170, h: W},

      {x: 410, y: 60,  w: 140, h: W},
      {x: 410, y: 520, w: 140, h: W},
    ];

    const doorRect = { x: 16, y: 175, w: 110, h: 210 };

    const portals = {
      F1: { x: 500, y: 90,  r: 14 },
      F2: { x: 470, y: 500, r: 14 },
      P:  { x: 70,  y: 60,  r: 14 },
    };

    const futureDestinations = [
      { F1: { x: 85,  y: 170 }, F2: { x: 160, y: 320 } },
      { F1: { x: 160, y: 320 }, F2: { x: 85,  y: 170 } },
    ];

    const pastSetbacks = [
      { x: 500, y: 320 },
      { x: 500, y: 170 },
    ];

    const pSize = 18;
    const moveStep = 9;

    const aSize = 18;
    const alienSpeed = 15;

    let px=0, py=0;
    let doorOpened = false;
    let timelineState = 0;
    let lastTeleportMs = 0;

    let aliens = [
      { x: 500, y: 260 },
      { x: 260, y: 120 },
      { x: 170, y: 460 },
    ];

    let running = true;
    let remainingMs = 180000;
    let lastFrame = performance.now();

    function updateScale() {
      const rect = room.getBoundingClientRect();
      const s = rect.width / BASE;
      world.style.transform = "scale(" + s + ")";
    }

    function rectsIntersect(a, b) {
      return (a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y);
    }

    function circleHit(cx, cy, r, x, y) {
      const dx = cx - x, dy = cy - y;
      return (dx*dx + dy*dy) <= (r*r);
    }

    function canOccupy(nx, ny, w, h) {
      nx = Math.max(0, Math.min(BASE - w, nx));
      ny = Math.max(0, Math.min(BASE - h, ny));
      const r = { x: nx, y: ny, w, h };
      for (const wv of walls) if (rectsIntersect(r, wv)) return null;
      return { nx, ny };
    }

    function renderWalls() {
      [...world.querySelectorAll(".wall")].forEach(el => el.remove());
      for (const w of walls) {
        const el = document.createElement("div");
        el.className = "wall";
        el.style.left = w.x + "px";
        el.style.top = w.y + "px";
        el.style.width = w.w + "px";
        el.style.height = w.h + "px";
        world.insertBefore(el, portalF1El);
      }
    }

    function positionStatics() {
      door.style.left = doorRect.x + "px";
      door.style.top  = doorRect.y + "px";
      door.style.width  = doorRect.w + "px";
      door.style.height = doorRect.h + "px";

      portalF1El.style.left = (portals.F1.x - 13) + "px";
      portalF1El.style.top  = (portals.F1.y - 13) + "px";
      portalF2El.style.left = (portals.F2.x - 13) + "px";
      portalF2El.style.top  = (portals.F2.y - 13) + "px";
      portalPEl.style.left  = (portals.P.x  - 13) + "px";
      portalPEl.style.top   = (portals.P.y  - 13) + "px";
    }

    function updateTimelineUI() {
      timelineText.textContent = timelineState === 0 ? "Stable" : "Altered";
    }

    function updatePlayerUI() {
      playerEl.style.left = px + "px";
      playerEl.style.top  = py + "px";

      const touchingDoor = rectsIntersect({ x: px, y: py, w: pSize, h: pSize }, doorRect);
      if (touchingDoor && !doorOpened && running) {
        openBtn.style.display = "inline-block";
        setStatus("You're at the door. Click Open.");
      } else {
        openBtn.style.display = "none";
        if (!doorOpened && running) setStatus("");
      }
    }

    function updateAliensUI() {
      for (let i=0;i<aliens.length;i++) {
        alienEls[i].style.left = aliens[i].x + "px";
        alienEls[i].style.top  = aliens[i].y + "px";
      }
    }

    function formatTime(ms) {
      const total = Math.max(0, Math.ceil(ms/1000));
      const m = Math.floor(total/60);
      const s = total % 60;
      return m + ":" + String(s).padStart(2,"0");
    }

    function setPlayerStart() {
      px = 500; py = 320;
      const ok = canOccupy(px, py, pSize, pSize);
      if (ok) { px = ok.nx; py = ok.ny; }
    }

    function resetAliens() {
      aliens = [
        { x: 500, y: 260 },
        { x: 260, y: 120 },
        { x: 170, y: 460 },
      ];
      for (let i=0;i<aliens.length;i++) {
        const ok = canOccupy(aliens[i].x, aliens[i].y, aSize, aSize);
        if (ok) { aliens[i].x = ok.nx; aliens[i].y = ok.ny; }
      }
    }

    function restartGame(reason) {
      running = true;
      doorOpened = false;
      door.classList.remove("open");
      timelineState = 0;
      updateTimelineUI();
      lastTeleportMs = 0;

      remainingMs = 180000;
      timerText.textContent = formatTime(remainingMs);
      boom.classList.remove("on");

      setPlayerStart();
      resetAliens();
      updatePlayerUI();
      updateAliensUI();

      setStatus(reason ? reason + " — restarting…" : "Restarting…");
      setTimeout(() => { if (running) setStatus(""); }, 900);
    }

    function explodeAndRestart() {
      running = false;
      openBtn.style.display = "none";
      setStatus("💥 Door exploded. You died.");
      boom.classList.add("on");
      setTimeout(() => {
        boom.classList.remove("on");
        restartGame("Time ran out");
      }, 850);
    }

    function dieAndRestart() {
      running = false;
      openBtn.style.display = "none";
      setStatus("👽 Got caught. You died.");
      boom.classList.add("on");
      setTimeout(() => {
        boom.classList.remove("on");
        restartGame("Caught by aliens");
      }, 750);
    }

    function tryMovePlayer(dir) {
      if (!running) return;
      let nx = px, ny = py;
      if (dir==="left") nx -= moveStep;
      if (dir==="right") nx += moveStep;
      if (dir==="up") ny -= moveStep;
      if (dir==="down") ny += moveStep;

      const ok = canOccupy(nx, ny, pSize, pSize);
      if (!ok) return;
      px = ok.nx; py = ok.ny;
      updatePlayerUI();
      checkPortals();
    }

    function checkPortals() {
      const now = Date.now();
      if (now - lastTeleportMs < 450) return;

      const cx = px + pSize/2;
      const cy = py + pSize/2;

      if (circleHit(cx, cy, portals.P.r, portals.P.x, portals.P.y)) {
        timelineState = 1 - timelineState;
        updateTimelineUI();
        const setback = pastSetbacks[timelineState];
        const ok = canOccupy(setback.x, setback.y, pSize, pSize);
        if (ok) { px = ok.nx; py = ok.ny; }
        lastTeleportMs = now;
        setStatus("⏳ Back in time! Future changed.");
        updatePlayerUI();
        return;
      }

      const map = futureDestinations[timelineState];

      if (circleHit(cx, cy, portals.F1.r, portals.F1.x, portals.F1.y)) {
        const dst = map.F1;
        const ok = canOccupy(dst.x, dst.y, pSize, pSize);
        if (ok) { px = ok.nx; py = ok.ny; }
        lastTeleportMs = now;
        setStatus("⚡ Future jump!");
        updatePlayerUI();
      } else if (circleHit(cx, cy, portals.F2.r, portals.F2.x, portals.F2.y)) {
        const dst = map.F2;
        const ok = canOccupy(dst.x, dst.y, pSize, pSize);
        if (ok) { px = ok.nx; py = ok.ny; }
        lastTeleportMs = now;
        setStatus("⚡ Future jump!");
        updatePlayerUI();
      }
    }

    function moveAlienTowards(a, targetX, targetY, dtSec) {
      const ax = a.x + aSize/2;
      const ay = a.y + aSize/2;
      const dx = (targetX - ax);
      const dy = (targetY - ay);
      const dist = Math.hypot(dx, dy) || 1;

      const wobble = ((Math.sin((performance.now()/700) + a.x) + Math.cos((performance.now()/900) + a.y)) * 0.6);
      const vx = (dx / dist) * alienSpeed * dtSec + wobble;
      const vy = (dy / dist) * alienSpeed * dtSec - wobble;

      let ok = canOccupy(a.x + vx, a.y, aSize, aSize);
      if (ok) { a.x = ok.nx; a.y = ok.ny; }
      else {
        ok = canOccupy(a.x, a.y + Math.sign(vx)*2, aSize, aSize);
        if (ok) { a.x = ok.nx; a.y = ok.ny; }
      }

      ok = canOccupy(a.x, a.y + vy, aSize, aSize);
      if (ok) { a.x = ok.nx; a.y = ok.ny; }
      else {
        ok = canOccupy(a.x + Math.sign(vy)*2, a.y, aSize, aSize);
        if (ok) { a.x = ok.nx; a.y = ok.ny; }
      }
    }

    function checkAlienCollisions() {
      const pRect = { x: px, y: py, w: pSize, h: pSize };
      for (const a of aliens) {
        const aRect = { x: a.x, y: a.y, w: aSize, h: aSize };
        if (rectsIntersect(pRect, aRect)) { dieAndRestart(); return; }
      }
    }

    function loop(now) {
      const dt = Math.min(50, now - lastFrame);
      lastFrame = now;

      if (running && !doorOpened) {
        remainingMs -= dt;
        timerText.textContent = formatTime(remainingMs);
        if (remainingMs <= 0) explodeAndRestart();
      }

      if (running) {
        const tx = px + pSize/2;
        const ty = py + pSize/2;
        const dtSec = dt / 1000;
        for (let i=0;i<aliens.length;i++) moveAlienTowards(aliens[i], tx, ty, dtSec);
        checkAlienCollisions();
        updateAliensUI();
      }

      requestAnimationFrame(loop);
    }

    document.addEventListener("keydown", (e) => {
      if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key)) e.preventDefault();
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") tryMovePlayer("left");
      if (e.key === "ArrowRight"|| e.key === "d" || e.key === "D") tryMovePlayer("right");
      if (e.key === "ArrowUp"   || e.key === "w" || e.key === "W") tryMovePlayer("up");
      if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") tryMovePlayer("down");
    }, { passive: false });

    function bindHold(el, dir) {
      let intervalId = null;
      const start = (e) => {
        if (e && e.cancelable) e.preventDefault();
        tryMovePlayer(dir);
        if (intervalId === null) intervalId = setInterval(() => tryMovePlayer(dir), 80);
      };
      const stop = (e) => {
        if (e && e.cancelable) e.preventDefault();
        if (intervalId !== null) { clearInterval(intervalId); intervalId = null; }
      };
      el.addEventListener("pointerdown", start);
      el.addEventListener("pointerup", stop);
      el.addEventListener("pointercancel", stop);
      el.addEventListener("pointerleave", stop);
      el.addEventListener("touchstart", start, { passive: false });
      el.addEventListener("touchend", stop, { passive: false });
      el.addEventListener("touchcancel", stop, { passive: false });
      el.addEventListener("mousedown", start);
      el.addEventListener("mouseup", stop);
      el.addEventListener("mouseleave", stop);
    }
    bindHold(btnUp, "up");
    bindHold(btnDown, "down");
    bindHold(btnLeft, "left");
    bindHold(btnRight, "right");

    function publishDoorsOpen() {
      if (!TRIGGER_URL) { setPill("Trigger: set TRIGGER_URL"); return; }
      setPill("Trigger: sending…");
      fetch(TRIGGER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(TRIGGER_PAYLOAD)
      })
      .then(res => {
        if (!res.ok) throw new Error("HTTP " + res.status);
        setPill("Trigger: sent ✅");
      })
      .catch(err => {
        console.log("Trigger error:", err);
        setPill("Trigger: failed");
      });
    }

    openBtn.addEventListener("click", () => {
      if (!running) return;
      doorOpened = true;
      door.classList.add("open");
      openBtn.style.display = "none";
      setStatus("the door is opened");
      publishDoorsOpen();
    });

    function layout() {
      updateScale();
      renderWalls();
      positionStatics();
      updatePlayerUI();
      updateAliensUI();
    }

    window.addEventListener("load", () => {
      setPill(TRIGGER_URL ? "Trigger: ready" : "Trigger: not configured");
      updateTimelineUI();
      timerText.textContent = formatTime(remainingMs);
      setPlayerStart();
      resetAliens();
      layout();
      requestAnimationFrame(loop);
    });
    window.addEventListener("resize", layout);
  </script>
</body>
</html>
